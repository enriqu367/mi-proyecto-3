<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Datos</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --success-hover: #059669;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 30px 15px;
      line-height: 1.5;
    }

    .contenedor {
      max-width: 750px;
      margin: 0 auto;
    }

    .tarjeta {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      padding: 28px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
      border-bottom: 2px solid var(--bg-body);
      padding-bottom: 10px;
    }

    .grupo-campo {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #f8fafc;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .grupo-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #btnRegistrar { background-color: var(--success); }
    #btnRegistrar:hover:not(:disabled) { background-color: var(--success-hover); }

    #btnConsultar { background-color: var(--primary); }
    #btnConsultar:hover:not(:disabled) { background-color: var(--primary-hover); }

    #btnModificar { background-color: var(--warning); color: #fff; }
    #btnModificar:hover:not(:disabled) { background-color: var(--warning-hover); }

    #btnEliminar { background-color: var(--danger); }
    #btnEliminar:hover:not(:disabled) { background-color: var(--danger-hover); }

    #btnCerrar {
      background-color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.85rem;
    }
    #btnCerrar:hover { background-color: #475569; }

    /* Mensaje de estado */
    #estado {
      margin-top: 16px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--primary);
      min-height: 24px;
    }

    /* Sección de Tabla */
    #seccionTabla {
      display: none;
    }

    .cabecera-tabla {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--bg-body);
      padding-bottom: 10px;
    }

    .cabecera-tabla h2 {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }

    #buscador {
      margin-bottom: 16px;
    }

    .tabla-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    tbody tr:hover {
      background-color: #f1f5f9;
    }

    /* Botones dentro de la tabla */
    td button {
      padding: 6px 10px;
      font-size: 0.82rem;
      margin-right: 6px;
    }

    td button:first-child {
      background-color: var(--warning);
    }
    td button:first-child:hover {
      background-color: var(--warning-hover);
    }

    td button:last-child {
      background-color: var(--danger);
      margin-right: 0;
    }
    td button:last-child:hover {
      background-color: var(--danger-hover);
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <!-- TARJETA DEL FORMULARIO -->
    <div class="tarjeta">
      <h2>Captura de Datos</h2>

      <form id="formulario">
        <input type="hidden" id="id">

        <div class="grupo-campo">
          <label for="dia">Día:</label>
          <input type="number" id="dia" placeholder="Ej. 15" required>
        </div>

        <div class="grupo-campo">
          <label for="dolar">Dólar:</label>
          <input type="number" step="any" id="dolar" placeholder="Ej. 18.50" required>
        </div>

        <!-- >>> AGREGAR CAMPO NUEVO (lugar 1 de 6)
             Copia un bloque div.grupo-campo y cambia el nombre y el id.
             Ejemplo:
             <div class="grupo-campo">
               <label for="telefono">Teléfono:</label>
               <input type="text" id="telefono" required>
             </div>
        -->

        <div class="grupo-botones">
          <button type="button" id="btnRegistrar">Registrar</button>
          <button type="button" id="btnConsultar">Consultar</button>
          <button type="button" id="btnModificar">Modificar</button>
          <button type="button" id="btnEliminar">Eliminar</button>
        </div>
      </form>

      <p id="estado"></p>
    </div>

    <!-- TARJETA DE LA TABLA -->
    <div id="seccionTabla" class="tarjeta">
      <div class="cabecera-tabla">
        <h2>Registros</h2>
        <button type="button" id="btnCerrar">Cerrar tabla</button>
      </div>

      <input type="text" id="buscador" placeholder="🔍 Buscar por día...">

      <div class="tabla-responsive">
        <table>
          <thead>
            <tr>
              <th>Fecha / Registro</th>
              <th>Día</th>
              <th>Dólar</th>
              <!-- >>> AGREGAR CAMPO NUEVO (lugar 2 de 6)
                   Agrega aquí el encabezado de la columna nueva.
                   Ejemplo: <th>Teléfono</th>
              -->
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Pega aquí la URL de tu implementación de Apps Script
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbx0AduxZmYJt7w6_RzpxEOjlJ5RFyN45nLL3OqKwHMFdNOMVoGbWcJEPMQyZDmVETscWw/exec";
    var registros = [];
    var tablaVisible = false;

    // ---------- Enviar datos al script ----------
    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); });
    }

    // ---------- Botones activos según el estado ----------
    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    // ---------- REGISTRAR ----------
    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      enviar({
        accion: "guardar",

        // >>> AGREGAR CAMPO NUEVO (lugar 3 de 6)
        // Cada campo termina con coma, EXCEPTO el último.
        dia: document.getElementById("dia").value,
        dolar: document.getElementById("dolar").value

      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    // ---------- CONSULTAR ----------
    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      });
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        if (!reg.dia.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        agregarCelda(tr, new Date(reg.dolar).toLocaleString());

        // >>> AGREGAR CAMPO NUEVO (lugar 4 de 6)
        // Agrega una línea por cada campo, en el mismo orden que los <th>.
        agregarCelda(tr, reg.dia);
        agregarCelda(tr, reg.dolar);

        var td = document.createElement("td");

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Editar";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // ---------- CERRAR TABLA ----------
    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    // ---------- Pasar el registro al formulario ----------
    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;

      // >>> AGREGAR CAMPO NUEVO (lugar 5 de 6)
      // Agrega una línea por cada campo (aquí SÍ todas terminan en punto y coma).
      document.getElementById("dia").value = reg.dia;
      document.getElementById("dolar").value = reg.dolar;

      document.getElementById("estado").textContent =
        "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById("dia").focus();
    }

    // ---------- MODIFICAR ----------
    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Editar'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      enviar({
        accion: "editar",
        id: id,

        // >>> AGREGAR CAMPO NUEVO (lugar 6 de 6)
        // Igual que en REGISTRAR: coma en todos, menos en el último.
        dia: document.getElementById("dia").value,
        dolar: document.getElementById("dolar").value

      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    // ---------- ELIMINAR ----------
    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    // ---------- Mensaje al terminar cualquier acción ----------
    function terminarAccion(respuesta, mensajeOk) {
      document.getElementById("estado").textContent =
        respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;
      limpiarFormulario();
      if (tablaVisible) cargarRegistros();
    }

    actualizarBotones();
  </script>

</body>
</html>
